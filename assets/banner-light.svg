<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t">
  <title id="t">Office Design Toolkit: skill Claude cho tài liệu Office, Adobe và thiết kế UI/UX</title>
  <style>
    text { font-family: 'Segoe UI', 'Be Vietnam Pro', 'Helvetica Neue', Arial, sans-serif; }
    .ink { fill: #1D3F73; }
    .sub { fill: #60656B; }
    .call { fill: none; stroke: #2F80ED; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .lead { stroke: #2F80ED; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .sheet { fill: #FFFFFF; stroke: #CDD0D5; stroke-width: 1.5; }
    .line { fill: #CDD0D5; }
    .badge { fill: #2469C9; }
    .num { fill: #FFFFFF; font-size: 14px; font-weight: 700; }
    .lab { fill: #1D3F73; font-size: 17px; font-weight: 600; }
  </style>
  <rect width="1280" height="360" fill="#F5F6F8"/>

  <text x="64" y="156" class="ink" font-size="48" font-weight="600">Office Design Toolkit</text>
  <text x="66" y="202" class="sub" font-size="20">Skill Claude cho tài liệu Office, Adobe</text>
  <text x="66" y="232" class="sub" font-size="20">và thiết kế giao diện UI/UX</text>

